name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SKILL.md frontmatter
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          import yaml

          for skill_path in (Path("SKILL.md"), Path("skills/twitterapi-io/SKILL.md")):
              content = skill_path.read_text(encoding="utf-8")
              if not content.startswith("---\n"):
                  raise SystemExit(f"{skill_path} must start with YAML frontmatter")
              match = re.search(r"\n---\s*\n", content[4:])
              if not match:
                  raise SystemExit(f"{skill_path} frontmatter is not closed")
              frontmatter = yaml.safe_load(content[4:match.start() + 4])
              if not isinstance(frontmatter, dict):
                  raise SystemExit(f"{skill_path} frontmatter must parse as a mapping")
              for field in ("name", "description"):
                  if not frontmatter.get(field):
                      raise SystemExit(f"{skill_path} frontmatter missing required field: {field}")
              json.dumps(frontmatter)
          PY

      - name: Extract version from SKILL.md
        id: version
        run: |
          VERSION=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' SKILL.md | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git tag -l "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new — will create release"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
